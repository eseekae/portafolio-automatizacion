[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bordado"
version = "0.3.0"
description = "Herramientas open source para matrices de bordado: conversion por lotes, digitalizacion y control de calidad"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyembroidery>=1.4.35", "Pillow>=10.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
matriz = "bordado.cli:main"

# gui-scripts (no "scripts"): en Windows evita que se abra una consola negra
# detras de la ventana.
[project.gui-scripts]
matriz-gui = "bordado.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
