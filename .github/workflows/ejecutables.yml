# Genera el ejecutable para Windows, macOS y Linux.
#
# PyInstaller empaqueta el interprete NATIVO de la maquina donde corre: no
# existe compilacion cruzada. Por eso cada sistema se construye en su propio
# runner y aqui se juntan los tres resultados.
#
# Uso:
#   - Manual: pestana Actions -> "Ejecutables" -> Run workflow
#   - Automatico: al publicar una etiqueta v* se adjuntan a la Release

name: Ejecutables

on:
  # Publicar a mano desde la pestana Actions, sin usar git: se escribe la
  # version y el workflow crea la etiqueta y la Release por si mismo.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (ej: v0.2.0). Vacio = solo compilar, sin publicar.'
        required: false
        default: ''
  # O automaticamente al subir una etiqueta con git.
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: bordado

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
            artefacto: ConversorBordado.exe
          - os: macos-latest
            nombre: macos
            artefacto: ConversorBordado
          - os: ubuntu-latest
            nombre: linux
            artefacto: ConversorBordado

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      # Un ejecutable roto no se publica: los tests corren antes de empaquetar.
      - name: Tests
        run: pytest -q

      - name: Empaquetar
        run: pyinstaller empaquetar/conversor.spec --noconfirm

      # Comprobacion minima de que el binario no muere al arrancar por un
      # import que PyInstaller no detecto.
      - name: Verificar que el binario arranca (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Start-Process resuelve rutas relativas contra el directorio del
          # proceso .NET, que no es el $PWD de PowerShell. Se pasa absoluta.
          $exe = (Resolve-Path "dist/${{ matrix.artefacto }}").Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "El ejecutable murio al arrancar (codigo $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "El ejecutable arranco correctamente."

      - name: Empaquetar .app de macOS
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -qry ConversorBordado-macos.zip ConversorBordado.app

      # Los adjuntos de una Release se nombran por su basename, y los binarios
      # de macOS y Linux salen ambos como "ConversorBordado". Se renombran aqui
      # para que no se pisen entre si al publicarlos.
      - name: Preparar entrega
        shell: bash
        run: |
          mkdir -p entrega
          case "${{ matrix.nombre }}" in
            windows) cp dist/ConversorBordado.exe       entrega/ConversorBordado.exe ;;
            macos)   cp dist/ConversorBordado-macos.zip entrega/ConversorBordado-macos.zip ;;
            linux)   cp dist/ConversorBordado           entrega/ConversorBordado-linux ;;
          esac
          ls -lh entrega

      - uses: actions/upload-artifact@v4
        with:
          name: ConversorBordado-${{ matrix.nombre }}
          path: bordado/entrega/*
          if-no-files-found: error
          retention-days: 30

  publicar:
    # Adjunta los tres binarios a una Release. Se activa al subir una etiqueta,
    # o al lanzar el workflow a mano indicando una version.
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binarios
      - uses: softprops/action-gh-release@v2
        with:
          # En un lanzamiento manual la etiqueta aun no existe: la accion la
          # crea sobre el commit actual.
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Conversor de matrices de bordado ${{ inputs.version || github.ref_name }}
          files: binarios/**/*
          generate_release_notes: true
          body: |
            Programa para convertir matrices de bordado entre formatos por lotes.
            Un solo archivo: no necesita instalador ni tener Python.

            | Sistema | Descarga |
            |---|---|
            | Windows | `ConversorBordado.exe` |
            | macOS | `ConversorBordado-macos.zip` |
            | Linux | `ConversorBordado-linux` |

            **Instrucciones de instalacion, incluido que hacer con el aviso de
            Windows SmartScreen y con Gatekeeper en macOS:**
            https://github.com/eseekae/portafolio-automatizacion/tree/main/bordado#descargar-e-instalar
